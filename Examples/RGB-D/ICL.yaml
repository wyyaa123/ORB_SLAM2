%YAML:1.0
---
#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------

# Camera calibration and distortion parameters (OpenCV) 
Camera.fx: 481.2
Camera.fy: -480.0
Camera.cx: 319.5
Camera.cy: 239.50

Camera.k1: 0
Camera.k2: 0
Camera.p1: 0
Camera.p2: 0
Camera.k3: 0

Camera.width: 640
Camera.height: 480

# Camera frames per second 
Camera.fps: 30.0

# IR projector baseline times fx (aprox.)
Camera.bf: 40.0

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# Close/Far threshold. Baseline times.
ThDepth: 40.0

# Deptmap values factor 
DepthMapFactor: 5000.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1000

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth: 0.9
Viewer.PointSize:2
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3
Viewer.ViewpointX: 0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500

#--------------------------------------------------------------------------------------------
# Edge Parameters
#--------------------------------------------------------------------------------------------
Curve.UseCurve: 1
Curve.BezierFitter: 1
Curve.MinDepth: 0
Curve.MaxDepth: 3.0
Curve.ValidRatio: 0.7
# 沿曲线采样顺序使用奇数窗口做深度中值滤波。
Curve.DepthMedianWindow: 5
# 孤立深度尖峰判定阈值：绝对阈值（米）和相对阈值取较大者。
Curve.MaxNeighborDepthJump: 0.08
Curve.MaxNeighborDepthJumpRatio: 0.03
# 只有当前关键帧比地图曲线至少多出这些连续采样点时才允许延长。
Curve.MinimumExtensionSamples: 5
# 重叠点融合门限以及新旧曲线拼接门限。
Curve.FusionMaxPixelDistance: 6.0
Curve.FusionMax3DDistance: 0.10
Curve.ExtensionMaxPixelGap: 10.0
Curve.ExtensionMax3DGap: 0.15
Curve.MinimumJoinDirectionCosine: 0.5
# 每次关键帧融合后的轻度三维平滑权重以及单点最大融合权重。
Curve.GeometrySmoothingWeight: 0.15
Curve.MaximumFusionWeight: 10
# 两条MapCurve真正合并前要求的三维重叠覆盖率和90%分位距离（米）。
Curve.MapFusionMinimum3DCoverage: 0.1
Curve.MapFusionMaximumP90Distance: 0.15
Curve.MatchSearchRadius: 3

Curve.MinCandidateHits: 2 # 搜索半径内覆盖的采样点数
Curve.MinCandidateCoverage: 0.1
Curve.UnmatchedCost: 2.0 # 匹配代价
